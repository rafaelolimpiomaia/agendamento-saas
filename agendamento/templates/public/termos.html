<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Termos de Uso — Agendamento Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --blue: #0d6efd;
            --blue-dark: #0a58ca;
            --blue-light: #e7f1ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            color: #111827;
            background: #f9fafb;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--blue);
            text-decoration: none;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 10px;
            border: 1.5px solid #e5e7eb;
            background: #fff;
            color: #374151;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            transition: all .2s;
        }

        .btn-voltar:hover { background: #f3f4f6; color: #111827; }

        /* ── HERO ── */
        .doc-hero {
            background: linear-gradient(135deg, var(--blue-light), #f0f6ff);
            padding: 56px 24px 48px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .doc-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--blue);
            color: #fff;
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
        }

        .doc-hero h1 {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .doc-hero p {
            font-size: 0.92rem;
            color: #6b7280;
        }

        /* ── CONTEÚDO ── */
        .doc-wrapper {
            max-width: 780px;
            margin: 48px auto;
            padding: 0 24px 80px;
        }

        .doc-card {
            background: #ffffff;
            border: 1.5px solid #e5e7eb;
            border-radius: 20px;
            padding: 48px 44px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
        }

        /* ── PLACEHOLDER ── */
        .placeholder-box {
            background: var(--blue-light);
            border: 2px dashed #93c5fd;
            border-radius: 14px;
            padding: 40px 32px;
            text-align: center;
            color: #1d4ed8;
        }

        .placeholder-box i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .placeholder-box h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .placeholder-box p {
            font-size: 0.88rem;
            opacity: 0.75;
            margin: 0;
        }

        /* ── FOOTER ── */
        .footer {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 28px 24px;
            font-size: 0.82rem;
        }

        .footer a { color: #94a3b8; text-decoration: none; }
        .footer a:hover { color: #fff; }

        @media (max-width: 576px) {
            .doc-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">
        <i class="bi bi-scissors"></i>
        Agendamento Digital
    </a>
    <a href="/cadastro" class="btn-voltar">
        <i class="bi bi-arrow-left"></i>
        Voltar
    </a>
</nav>

<div class="doc-hero">
    <div class="doc-badge">
        <i class="bi bi-file-text"></i>
        Documento legal
    </div>
    <h1>Termos de Uso</h1>
    <p>Última atualização: <strong>a definir</strong></p>
</div>

<div class="doc-wrapper">
    <div class="doc-card">

        <!-- ── COLE O TEXTO DOS TERMOS AQUI ── -->
        <div class="placeholder-box">
            <i class="bi bi-file-earmark-text"></i>
            <h3>Texto dos Termos de Uso</h3>
            <p>Cole aqui o texto gerado pelo Termly ou outro gerador de termos de uso.</p>
        </div>
        <!-- ── FIM DO TEXTO ── -->

    </div>
</div>

<footer class="footer">
    <p>© 2025 Agendamento Digital — Todos os direitos reservados</p>
    <p style="margin-top:6px;">
        Dúvidas? <a href="https://wa.me/5583993024480" target="_blank">Fale conosco pelo WhatsApp</a>
    </p>
</footer>

</body>
</html>
