{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}{{ tenant.nome }} — Agendamentos{% endblock %}</title>

    <link rel="icon" href="{% static 'agendamento/calendar.svg' %}" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
    :root {
        --cor-primaria: {{ config.cor_primaria|default:'#0d6efd' }};
    }

    .btn-primary {
        background-color: var(--cor-primaria) !important;
        border-color: var(--cor-primaria) !important;
    }

    .btn-primary:hover {
        background-color: color-mix(in srgb, var(--cor-primaria) 85%, black) !important;
        border-color: color-mix(in srgb, var(--cor-primaria) 85%, black) !important;
    }
</style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Botão flutuante de tutorial -->
<button id="help-fab" onclick="window.location.href='{% url 'tutorial' tenant_slug=tenant_slug %}?ajuda=1'" aria-label="Abrir tutorial de ajuda" style="
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background-color: var(--cor-primaria);
    color: white;
    border: none;
    border-radius: 99px;
    padding: 0.65rem 1.1rem;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 16px rgba(16, 18, 20, 0.35);
    z-index: 1050;
">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    {{ tenant.nome }} - Tutorial
</button>

    {% block extra_js %}{% endblock %}
</body>
</html>
