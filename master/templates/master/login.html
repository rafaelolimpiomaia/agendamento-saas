<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Master — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --card: #161925;
            --border: #262b3d;
            --text: #e5e7eb;
            --muted: #8b93a7;
            --accent: #6366f1;
            --accent-soft: rgba(99,102,241,0.12);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .brand i { font-size: 1.6rem; color: var(--accent); }
        .brand span { font-size: 1.15rem; font-weight: 800; }
        .brand small { display: block; font-size: 0.75rem; color: var(--muted); text-align: center; }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 18px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .btn-login {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.88; }
        .alert {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.88rem;
            color: var(--danger);
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <div>
            <div style="display:flex;align-items:center;gap:10px;justify-content:center;">
                <i class="bi bi-shield-lock-fill"></i>
                <span>Painel Master</span>
            </div>
            <small>Acesso restrito ao administrador da plataforma</small>
        </div>
    </div>

    {% for message in messages %}
        <div class="alert">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" placeholder="seu usuário" autofocus required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>
    </form>
</div>
</body>
</html>
