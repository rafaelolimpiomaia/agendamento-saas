<!-- master/templates/master/base_master.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Painel Master{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1117;
            --bg-card: #161925;
            --bg-hover: #1e2230;
            --border: #262b3d;
            --text-main: #e5e7eb;
            --text-muted: #8b93a7;
            --accent: #6366f1;
            --accent-soft: rgba(99, 102, 241, 0.12);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .sidebar-brand i { font-size: 1.4rem; color: var(--accent); }
        .sidebar-brand span { font-weight: 800; font-size: 1.05rem; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
            transition: all 0.15s;
        }

        .nav-item:hover { background: var(--bg-hover); color: var(--text-main); }
        .nav-item.active { background: var(--accent-soft); color: var(--accent); }
        .nav-item i { font-size: 1.05rem; width: 20px; }

        /* ── CONTEÚDO ── */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 32px 36px;
        }

        /* ── CARDS ── */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 8px;
        }

        /* ── TABELAS ── */
        table { width: 100%; border-collapse: collapse; }
        thead th {
            text-align: left;
            padding: 12px 14px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        tbody td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        tbody tr:hover { background: var(--bg-hover); }

        /* ── BADGES ── */
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-ativo { background: rgba(34,197,94,0.12); color: var(--success); }
        .badge-teste { background: rgba(99,102,241,0.12); color: var(--accent); }
        .badge-congelado { background: rgba(245,158,11,0.12); color: var(--warning); }
        .badge-suspenso, .badge-cancelado { background: rgba(239,68,68,0.12); color: var(--danger); }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-shield-lock-fill"></i>
            <span>Painel Master</span>
        </div>
        <nav>
            <a href="{% url 'master_dashboard' %}" class="nav-item">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="{% url 'master_listar_saloes' %}" class="nav-item">
                <i class="bi bi-shop"></i> Salões
            </a>
            <a href="{% url 'master_codigos_ativacao' %}" class="nav-item">
                <i class="bi bi-key"></i> Códigos de Ativação
            </a>
            <a href="{% url 'master_logout' %}" class="nav-item" style="margin-top:20px; color:var(--danger);">
                <i class="bi bi-box-arrow-right"></i> Sair
            </a>
        </nav>
    </aside>

    <main class="main-content">
        {% for message in messages %}
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
                        padding:12px 16px; margin-bottom:20px; font-size:0.9rem;">
                {{ message }}
            </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
